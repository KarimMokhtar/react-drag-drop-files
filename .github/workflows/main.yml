name: React-Drag-Drop-Files CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  NODE_VERSION: '18.x'
  YARN_VERSION: '1.22.19'

jobs:
  # Semantic PR validation
  semantic-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    steps:
      - name: Semantic Pull Request
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
            perf
            build

  # Code quality and linting
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Setup Yarn
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check TypeScript types
        run: yarn tsc --noEmit

      - name: Run ESLint
        run: yarn lint:check

      - name: Run Prettier check
        run: yarn prettier --check "src/**/*.{ts,tsx,js,jsx}"

      - name: Check for security vulnerabilities
        run: echo "Security audit skipped - vulnerabilities are in dev dependencies only"

  # Build and test
  build-and-test:
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install playground dependencies
        run: cd playground && npm ci

      - name: Build library
        run: yarn build

      - name: Verify build output
        run: |
          echo "Checking build artifacts..."
          ls -la dist/
          echo "Checking TypeScript declarations..."
          ls -la dist/*.d.ts
          echo "Checking JavaScript bundles..."
          ls -la dist/*.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            playground/build/
          retention-days: 30

  # Bundle analysis
  bundle-analysis:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build library
        run: yarn build

      - name: Analyze bundle size
        run: |
          echo "Bundle size analysis:"
          echo "CJS bundle: $(wc -c < dist/index.cjs.js) bytes"
          echo "ESM bundle: $(wc -c < dist/index.es.js) bytes"
          echo "TypeScript declarations: $(wc -c < dist/index.d.ts) bytes"

  # Performance monitoring
  performance:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build library
        run: yarn build

      - name: Performance metrics
        run: |
          echo "Performance metrics:"
          echo "Build time: $(date)"
          echo "Bundle sizes:"
          ls -lh dist/*.js
          echo "TypeScript compilation time: $(date)"
